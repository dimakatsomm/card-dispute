# Workspace + dependency catalog.
#
# RULE (after F-01): pnpm-lock.yaml and this catalog are orchestrator-owned. Packages declare dependencies
# only as "catalog:" references to entries below. Adding or changing a dependency is NOT an implementer
# action: stop and report it to the orchestrator (no lockfile collisions between parallel agents).
#
# Versions were looked up with `npm view <pkg> version` on 2026-10-19 and pinned exactly.
# Deviation: typescript is pinned to 6.0.3, not latest 7.0.2, because typescript-eslint 8.72.0 declares
# peer typescript ">=4.8.4 <6.1.0".

packages:
  - backend/packages/*
  - backend/auth
  - backend/users
  - backend/transactions
  - backend/disputes
  - backend/lambdas/*
  - frontend
  - tests/*
  - tools/*

catalog:
  # Backend runtime
  fastify: 5.12.7
  zod: 4.6.7
  pino: 10.4.0
  pg: 8.23.1
  aws-jwt-verify: 5.2.1
  node-pg-migrate: 9.0.0
  '@aws-sdk/client-sqs': 3.1152.0
  '@aws-sdk/client-s3': 3.1152.0
  '@aws-sdk/s3-request-presigner': 3.1152.0
  '@aws-sdk/client-sesv2': 3.1152.0
  # Backend test
  '@testcontainers/postgresql': 12.2.1
  testcontainers: 12.2.1
  aws-sdk-client-mock: 4.1.0
  # Tooling
  typescript: 6.0.3
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  tsx: 4.23.15
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5
  eslint: 10.13.0
  typescript-eslint: 8.72.0
  '@eslint/js': 10.0.1
  prettier: 3.9.10
  esbuild: 0.28.2
  # Frontend
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  react-router: 8.5.0
  oidc-client-ts: 3.5.0
  '@tanstack/react-query': 5.104.5
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  jsdom: 30.1.3
  '@playwright/test': 1.64.1

# orchestrator-approved exceptions to the release-age gate; add entries only via the orchestrator
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.72.0'
  - '@typescript-eslint/parser@8.72.0'
  - '@typescript-eslint/project-service@8.72.0'
  - '@typescript-eslint/scope-manager@8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.72.0'
  - '@typescript-eslint/type-utils@8.72.0'
  - '@typescript-eslint/types@8.72.0'
  - '@typescript-eslint/typescript-estree@8.72.0'
  - '@typescript-eslint/utils@8.72.0'
  - '@typescript-eslint/visitor-keys@8.72.0'
  - typescript-eslint@8.72.0
