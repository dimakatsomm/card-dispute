# Orchestrator-owned: packages use "catalog:" only; adding a dependency means asking the orchestrator.
# typescript stays on 6.0.x until typescript-eslint supports 7.

packages:
  - backend/packages/*
  - backend/auth
  - backend/users
  - backend/transactions
  - backend/disputes
  - backend/lambdas/*
  - frontend
  - tests/*
  - tools/*
  - local/*

allowBuilds:
  core-js: false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false

catalog:
  '@hey-api/openapi-ts': 0.99.0
  '@redocly/cli': 2.77.0
  fastify: 5.12.8
  zod: 4.6.7
  pino: 10.4.0
  pg: 8.23.1
  aws-jwt-verify: 5.2.1
  node-pg-migrate: 9.0.0
  '@aws-sdk/client-sqs': 3.1165.0
  '@aws-sdk/client-s3': 3.1165.0
  '@aws-sdk/client-lambda': 3.1165.0
  '@aws-sdk/s3-request-presigner': 3.1165.0
  '@aws-sdk/client-sesv2': 3.1165.0
  '@aws-sdk/client-secrets-manager': 3.1165.0
  '@aws-sdk/client-cognito-identity-provider': 3.1165.0
  '@aws-sdk/client-ec2': 3.1165.0
  '@aws-sdk/client-ecs': 3.1165.0
  '@aws-sdk/client-cloudwatch': 3.1165.0
  '@aws-sdk/client-sts': 3.1165.0
  '@testcontainers/postgresql': 12.2.1
  testcontainers: 12.2.1
  aws-sdk-client-mock: 4.1.0
  typescript: 6.0.3
  '@types/node': 26.6.6
  '@types/pg': 8.23.1
  tsx: 4.23.15
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
  eslint: 10.14.0
  typescript-eslint: 8.72.2
  '@eslint/js': 10.0.1
  prettier: 3.9.10
  esbuild: 0.28.2
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.7
  '@vitejs/plugin-react': 6.3.0
  react-router: 8.5.1
  oidc-client-ts: 3.5.0
  '@tanstack/react-query': 5.107.1
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  '@testing-library/react': 16.3.3
