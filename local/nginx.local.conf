worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # $uri, not $request: the OIDC callback query carries the authorization code and must not be logged.
    log_format spa '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                   '$request_time "$http_x_correlation_id"';
    access_log /dev/stdout spa;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Rendered at start by docker-entrypoint.sh; add_header in a location drops inherited ones, hence the include in each.
        include /tmp/runtime/security-headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location = /config.js {
            root /tmp/runtime;
            include /tmp/runtime/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            include /tmp/runtime/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Local stand-in for CloudFront (ADR-037): strips /api and routes by path. Variables defer DNS to request time.
        resolver 127.0.0.11 valid=10s;

        location /api/ {
            return 404;
        }

        location = /api/me {
            include /tmp/runtime/security-headers.conf;
            set $upstream http://users:8080;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header If-Match $http_if_match;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        location ~ ^/api/transactions(/|$) {
            include /tmp/runtime/security-headers.conf;
            set $upstream http://transactions:8080;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header If-Match $http_if_match;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        location ~ ^/api/disputes?(/|$) {
            include /tmp/runtime/security-headers.conf;
            set $upstream http://disputes:8080;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header If-Match $http_if_match;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        location / {
            include /tmp/runtime/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
