name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENV_DIR: infra/terraform/envs/dev

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Terraform arrives in a later milestone; skip until the env exists.
      - name: Detect env
        id: tf
        run: |
          if [ -d "$ENV_DIR" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ENV_DIR not found, skipping"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.tf.outputs.found == 'true'
        with:
          terraform_wrapper: false

      - name: Format
        if: steps.tf.outputs.found == 'true'
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Init (no backend)
        if: steps.tf.outputs.found == 'true'
        run: terraform -chdir="$ENV_DIR" init -backend=false -input=false

      - name: Validate
        if: steps.tf.outputs.found == 'true'
        run: terraform -chdir="$ENV_DIR" validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.tf.outputs.found == 'true'

      - name: tflint
        if: steps.tf.outputs.found == 'true'
        run: |
          tflint --init
          tflint --recursive --chdir=infra/terraform

      - name: checkov
        if: steps.tf.outputs.found == 'true'
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
