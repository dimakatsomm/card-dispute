name: lambda-retention-sweeper

on:
  pull_request:
    paths:
      - "backend/lambdas/retention-sweeper/**"
      - "backend/packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/lambda-retention-sweeper.yml"
      - ".github/workflows/_build.yml"
  push:
    branches: [main]
    paths:
      - "backend/lambdas/retention-sweeper/**"
      - "backend/packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/lambda-retention-sweeper.yml"
      - ".github/workflows/_build.yml"
      - ".github/workflows/_publish.yml"
      - ".github/workflows/_deploy-lambda.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: Full git sha of an already published image to deploy (main only); empty builds, publishes and deploys this commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.sha == ''
    uses: ./.github/workflows/_build.yml
    with:
      package-filter: "@cd/retention-sweeper"
      package-dir: backend/lambdas/retention-sweeper
      image-name: lambda-retention-sweeper
      lambda: true

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sha == ''))
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish.yml
    with:
      repo-key: lambda-retention-sweeper
      dockerfile: backend/lambdas/retention-sweeper/Dockerfile

  deploy:
    # Functions exist only after infra phase B; set repository variable LAMBDAS_DEPLOYED=true then.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.LAMBDAS_DEPLOYED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.sha != '') || needs.publish.result == 'success') }}
    needs: publish
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-lambda.yml
    with:
      function-key: retention-sweeper
      sha: ${{ inputs.sha || github.sha }}
