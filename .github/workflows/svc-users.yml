name: svc-users

on:
  pull_request:
    paths:
      - "backend/users/**"
      - "backend/packages/**"
      - "docs/openapi/**"
      - "backend/packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/svc-users.yml"
      - ".github/workflows/_build.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: Full git sha of an already published image to deploy; empty builds, publishes and deploys this commit
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "backend/users/**"
      - "backend/packages/**"
      - "docs/openapi/**"
      - "backend/packages/contracts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/svc-users.yml"
      - ".github/workflows/_build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.sha == ''
    uses: ./.github/workflows/_build.yml
    with:
      package-filter: "@cd/users"
      package-dir: backend/users
      image-name: svc-users

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sha == ''))
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish.yml
    with:
      repo-key: svc-users
      dockerfile: backend/users/Dockerfile

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sha == ''))
    needs: publish
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-ecs.yml
    with:
      service: users
      sha: ${{ github.sha }}

  deploy-sha:
    if: github.event_name == 'workflow_dispatch' && inputs.sha != '' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy-ecs.yml
    with:
      service: users
      sha: ${{ inputs.sha || github.sha }}
