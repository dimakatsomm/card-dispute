name: web

on:
  pull_request:
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
      - ".github/workflows/_build.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/openapi/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - "package.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
      - ".github/workflows/_build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      package-filter: "@cd/web"
      package-dir: frontend
      image-name: web
      check-api: true
