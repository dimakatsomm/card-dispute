name: repo-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:lint-rules

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history so the scanned commit range is available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI avoids the gitleaks-action licence requirement on organisation repos.
      - name: Install gitleaks
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Config and ignore file come from the trusted base, never the PR head.
      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
            trusted="$PR_BASE"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER"
            trusted="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
            trusted="$PUSH_BEFORE"
          fi
          args=(--no-banner --redact --verbose --log-opts="$range")
          if git show "$trusted:.gitleaks.toml" > "$RUNNER_TEMP/gl.toml" 2>/dev/null; then
            args+=(--config "$RUNNER_TEMP/gl.toml")
          fi
          git show "$trusted:.gitleaksignore" > "$RUNNER_TEMP/gl.ignore" 2>/dev/null || : > "$RUNNER_TEMP/gl.ignore"
          args+=(--gitleaks-ignore-path "$RUNNER_TEMP/gl.ignore")
          gitleaks git "${args[@]}" .

  # One stable check name for branch protection, green only if every job passed.
  ci-gate:
    if: always()
    needs: [lint, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require upstream success
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "upstream result: $r"; exit 1; }
          done
