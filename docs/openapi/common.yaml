openapi: 3.1.0
info:
  title: Card Dispute Platform — shared components
  version: 0.1.0
  description: |
    Shared schemas, parameters, responses and security schemes referenced by every service spec.
    Not a deployable API on its own.
paths: {}
components:
  securitySchemes:
    userToken:
      type: oauth2
      description: |
        Cognito **access token** for a customer (hosted login, authorization code + PKCE).
        Accepted only on public-port (8080) operations. A service token on a public route → 403.
      flows:
        authorizationCode:
          authorizationUrl: https://cd-dev.auth.af-south-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://cd-dev.auth.af-south-1.amazoncognito.com/oauth2/token
          scopes: {}
    serviceToken:
      type: oauth2
      description: |
        Cognito **client_credentials** access token for one of our services/Lambdas.
        Accepted only on service-port (8081) operations. A user token on a service route → 403.
      flows:
        clientCredentials:
          tokenUrl: https://cd-dev.auth.af-south-1.amazoncognito.com/oauth2/token
          scopes:
            auth/validate: Call auth POST /validate
            users/cards.read: Read a user's cards
            users/contact.read: Read a user's contact details for notifications
            transactions/read: Raw transaction lookup by user + ids
            disputes/read: Batch dispute lookup by user + transaction ids
            disputes/review: Move a dispute to UNDER_REVIEW
            disputes/resolve: Resolve a dispute (agent)
            disputes/evidence.write: Record evidence scan/validation result

  headers:
    CorrelationId:
      description: Echoed from the request if valid (`^[A-Za-z0-9-]{8,64}$`), otherwise generated.
      schema: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
    ETag:
      description: Current dispute `version`, quoted (e.g. `"3"`). Send back in `If-Match`.
      schema: { type: string, example: '"1"' }

  parameters:
    CorrelationIdHeader:
      name: x-correlation-id
      in: header
      required: false
      schema: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: { type: string, maxLength: 512 }
    TransactionIdPath:
      name: transactionId
      in: path
      required: true
      description: One dispute per transaction, ever, so this also identifies the dispute.
      schema: { $ref: '#/components/schemas/Uuid' }
    UserIdQueryRequired:
      name: userId
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TransactionIdsQuery:
      name: transactionIds
      in: query
      required: true
      description: Comma-separated, 1–100 ids.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items: { $ref: '#/components/schemas/Uuid' }

  schemas:
    Uuid:
      type: string
      format: uuid
    Money:
      type: string
      description: Decimal string, 2 places, never a float.
      pattern: '^[0-9]{1,10}\.[0-9]{2}$'
      example: '125.50'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      example: ZAR
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference, example: 'https://errors.cd.example/not-eligible' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Stable machine-readable code. }
        correlationId: { type: string }
    ReasonCode:
      type: string
      enum: [FRAUD, NOT_RECEIVED, DUPLICATE, INCORRECT_AMOUNT, CANCELLED_SUBSCRIPTION, DEFECTIVE_GOODS, OTHER]
    DisputeStatus:
      type: string
      enum: [SUBMITTED, UNDER_REVIEW, RESOLVED_ACCEPTED, RESOLVED_REJECTED, WITHDRAWN]
    EligibilityReason:
      type: string
      description: First failing rule in docs/04 order, or UNAVAILABLE when a dependency did not answer.
      enum: [ALREADY_DISPUTED, CARD_EXPIRED, TXN_NOT_POSTED, TXN_TYPE_NOT_DISPUTABLE, OUTSIDE_WINDOW, UNAVAILABLE]
    TransactionType:
      type: string
      enum: [PURCHASE, REFUND, ATM_WITHDRAWAL, FEE]
    TransactionStatus:
      type: string
      enum: [PENDING, POSTED, DECLINED, REVERSED]
    CardBrand:
      type: string
      enum: [VISA, MASTERCARD, AMEX]
    CardType:
      type: string
      enum: [DEBIT, CREDIT]
    CardStatus:
      type: string
      description: Expiry is NOT a status; see `expired`.
      enum: [ACTIVE, BLOCKED, CANCELLED]
    Card:
      type: object
      required: [cardId, accountId, brand, cardType, last4, expiryMonth, expiryYear, expired, status]
      properties:
        cardId: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        brand: { $ref: '#/components/schemas/CardBrand' }
        cardType: { $ref: '#/components/schemas/CardType' }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        expiryMonth: { type: integer, minimum: 1, maximum: 12 }
        expiryYear: { type: integer, minimum: 2000, maximum: 2100 }
        expired:
          type: boolean
          description: Computed server-side by isCardExpired() — valid through the last day of the expiry month (UTC).
        status: { $ref: '#/components/schemas/CardStatus' }
    RawTransaction:
      type: object
      required: [transactionId, accountId, cardId, amount, currency, merchantName, type, status, transactionAt, postedAt]
      properties:
        transactionId: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        cardId: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        merchantName: { type: string }
        mcc: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
        type: { $ref: '#/components/schemas/TransactionType' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        transactionAt: { $ref: '#/components/schemas/Timestamp' }
        postedAt:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, malformed, expired or invalid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Wrong principal type for this port, or missing scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not owned by the caller (existence is never revealed).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: A dependency needed to answer (auth or another service) is unavailable. Never fail-open.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
