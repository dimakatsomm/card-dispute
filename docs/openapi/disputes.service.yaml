openapi: 3.1.0
info:
  title: Disputes service — service port (8081)
  version: 0.1.0
  description: |
    Service-to-service disputes API. Every operation requires a **service** token with the listed scope; user tokens → 403.
    All writes are idempotent: re-applying an already-applied change returns 200 with the current state.
    `expectedVersion` mismatch → 412. Responses are tolerant: callers ignore fields they do not know. Callers reach this port via Service Connect (tasks) or the internal ALB (Lambdas).
servers:
  - url: http://disputes.cd.internal:8081
    description: Service Connect / internal ALB (dev)
paths:
  /disputes:
    get:
      operationId: lookupDisputes
      summary: Dispute state for a user's transactions (batch)
      description: |
        Callers — transactions, once per page, for the `dispute`/`disputable` fields; dispute-notifier, for the current
        `version` of one dispute (staleness check, ADR-055). Both use scope `disputes/read`. Makes no outbound calls.
      security:
        - serviceToken: [disputes/read]
      parameters:
        - $ref: './common.yaml#/components/parameters/CorrelationIdHeader'
        - $ref: './common.yaml#/components/parameters/UserIdQueryRequired'
        - $ref: './common.yaml#/components/parameters/TransactionIdsQuery'
      responses:
        '200':
          description: Disputes that exist for those transactions (absent = never disputed)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [transactionId, disputeId, status, version]
                      properties:
                        transactionId: { $ref: './common.yaml#/components/schemas/Uuid' }
                        disputeId: { $ref: './common.yaml#/components/schemas/Uuid' }
                        status: { $ref: './common.yaml#/components/schemas/DisputeStatus' }
                        version: { type: integer, minimum: 1, description: Current dispute version; the notifier compares it with the event version to skip stale status emails. }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /review-queue:
    get:
      operationId: listReviewQueue
      summary: Back-office queue — disputes awaiting or under review, oldest first
      security:
        - serviceToken: [disputes/review]
      parameters:
        - $ref: './common.yaml#/components/parameters/CorrelationIdHeader'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [SUBMITTED, UNDER_REVIEW] }, default: [SUBMITTED] }
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page, ordered createdAt asc
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [disputeId, transactionId, userId, status, reasonCode, version, createdAt]
                      properties:
                        disputeId: { $ref: './common.yaml#/components/schemas/Uuid' }
                        transactionId: { $ref: './common.yaml#/components/schemas/Uuid' }
                        userId: { $ref: './common.yaml#/components/schemas/Uuid' }
                        status: { $ref: './common.yaml#/components/schemas/DisputeStatus' }
                        reasonCode: { $ref: './common.yaml#/components/schemas/ReasonCode' }
                        version: { type: integer, minimum: 1 }
                        createdAt: { $ref: './common.yaml#/components/schemas/Timestamp' }
                  nextCursor:
                    oneOf:
                      - $ref: './common.yaml#/components/schemas/Cursor'
                      - type: 'null'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }

  /dispute/{transactionId}/review:
    put:
      operationId: reviewDispute
      summary: SUBMITTED → UNDER_REVIEW
      description: Caller — back-office on behalf of a human agent (AGENT only; no automation changes dispute status).
      security:
        - serviceToken: [disputes/review]
      parameters:
        - $ref: './common.yaml#/components/parameters/TransactionIdPath'
        - $ref: './common.yaml#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDisputeRequest' }
      responses:
        '200': { $ref: '#/components/responses/DisputeState' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/StaleVersion' }

  /dispute/{transactionId}/resolution:
    put:
      operationId: resolveDispute
      summary: Resolve (AGENT only) — SUBMITTED/UNDER_REVIEW → RESOLVED_ACCEPTED | RESOLVED_REJECTED
      security:
        - serviceToken: [disputes/resolve]
      parameters:
        - $ref: './common.yaml#/components/parameters/TransactionIdPath'
        - $ref: './common.yaml#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveDisputeRequest' }
      responses:
        '200': { $ref: '#/components/responses/DisputeState' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '412': { $ref: '#/components/responses/StaleVersion' }

  /dispute/{transactionId}/evidence/{evidenceId}:
    put:
      operationId: recordEvidenceResult
      summary: Record scan/validation result for an uploaded file
      description: |
        Caller — evidence-intake Lambda after the malware scan and the magic-byte/size/checksum checks.
        STORED → timeline EVIDENCE_ADDED; REJECTED → EVIDENCE_REJECTED. Same result again → 200 no-op.
        disputes compares the reported facts (sha256, sizeBytes, contentType) with the declared ones. A STORED result whose
        facts differ is recorded REJECTED (TYPE_MISMATCH, SIZE or CHECKSUM) and answered 200 with `status` REJECTED, so the
        caller must act on the response, not on what it sent. `s3Key` (`evidence/{disputeId}/{evidenceId}`) is set by
        disputes only, is present when `status` is STORED, and is where the caller copies the object to; the body never
        carries it. An `evidenceId` that is not this dispute's → 404. A result for an EXPIRED/ERASED item → 409
        `EVIDENCE_CLOSED`; one that conflicts with the already settled result (STORED vs REJECTED) → 409 `RESULT_CONFLICT`.
      security:
        - serviceToken: [disputes/evidence.write]
      parameters:
        - $ref: './common.yaml#/components/parameters/TransactionIdPath'
        - { name: evidenceId, in: path, required: true, schema: { $ref: './common.yaml#/components/schemas/Uuid' } }
        - $ref: './common.yaml#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/EvidenceStored'
                - $ref: '#/components/schemas/EvidenceRejected'
              discriminator:
                propertyName: result
                mapping:
                  STORED: '#/components/schemas/EvidenceStored'
                  REJECTED: '#/components/schemas/EvidenceRejected'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [evidenceId, status]
                properties:
                  evidenceId: { $ref: './common.yaml#/components/schemas/Uuid' }
                  status: { type: string, enum: [STORED, REJECTED] }
                  s3Key: { type: string, minLength: 1, description: 'Evidence-bucket key `evidence/{disputeId}/{evidenceId}`; present when status is STORED.' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/EvidenceResultConflict' }

components:
  securitySchemes:
    serviceToken: { $ref: './common.yaml#/components/securitySchemes/serviceToken' }
  schemas:
    AgentActor:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { const: AGENT }
        id: { type: string, minLength: 1, maxLength: 128, description: Agent's Cognito sub. Never shown to customers. }
    ReviewDisputeRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedVersion]
      properties:
        actor: { $ref: '#/components/schemas/AgentActor' }
        expectedVersion: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
    ResolveDisputeRequest:
      type: object
      additionalProperties: false
      required: [outcome, note, actor, expectedVersion]
      properties:
        outcome: { type: string, enum: [ACCEPTED, REJECTED] }
        note: { type: string, minLength: 1, maxLength: 2000, description: Shown to the customer on the timeline. }
        actor: { $ref: '#/components/schemas/AgentActor' }
        expectedVersion: { type: integer, minimum: 1 }
    EvidenceStored:
      type: object
      additionalProperties: false
      required: [result, sha256, sizeBytes, contentType]
      properties:
        result: { const: STORED }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png], description: Detected from magic bytes. }
    EvidenceRejected:
      type: object
      additionalProperties: false
      required: [result, reason]
      description: The facts are optional because intake cannot observe them when the scan verdict is ACCESS_DENIED, FAILED or SKIPPED, or HeadObject fails.
      properties:
        result: { const: REJECTED }
        reason: { type: string, enum: [MALWARE, TYPE_MISMATCH, CHECKSUM, SIZE, SCAN_FAILED] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        sizeBytes: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1, description: Detected from magic bytes; may be a type we do not accept. }
  responses:
    DisputeState:
      description: Current state after the (possibly no-op) change
      content:
        application/json:
          schema:
            type: object
            required: [disputeId, transactionId, status, version]
            properties:
              disputeId: { $ref: './common.yaml#/components/schemas/Uuid' }
              transactionId: { $ref: './common.yaml#/components/schemas/Uuid' }
              status: { $ref: './common.yaml#/components/schemas/DisputeStatus' }
              version: { type: integer, minimum: 1 }
    InvalidTransition:
      description: '`INVALID_TRANSITION` — not allowed from the current status (e.g. terminal).'
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    EvidenceResultConflict:
      description: |
        `EVIDENCE_CLOSED` — the item is EXPIRED or ERASED, so no result can be recorded (the caller discards the upload).
        `RESULT_CONFLICT` — the item already settled as the other result (STORED vs REJECTED); the first result stands.
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
    StaleVersion:
      description: '`expectedVersion` does not match.'
      content:
        application/problem+json:
          schema: { $ref: './common.yaml#/components/schemas/Problem' }
