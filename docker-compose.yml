# Infrastructure only; the services join in L-02. All values come from local/.env.example defaults.
name: card-dispute

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-disputes}
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [local]

  moto:
    image: motoserver/moto:5.2.4
    command: ['-H', '0.0.0.0', '-p', '5000']
    ports:
      - '${MOTO_HOST_PORT:-55000}:5000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [local]

  moto-init:
    image: motoserver/moto:5.2.4
    entrypoint: ['python', '/init/init.py']
    depends_on:
      moto:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_DEFAULT_REGION: ${AWS_REGION:-af-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      MOTO_BUCKETS: ${MOTO_BUCKETS:-cd-evidence-quarantine,cd-evidence}
      MOTO_QUEUE: ${MOTO_QUEUE:-dispute-notifications}
      MOTO_MAX_RECEIVE_COUNT: ${MOTO_MAX_RECEIVE_COUNT:-5}
    volumes:
      - ./local/moto/init.py:/init/init.py:ro
    restart: 'no'
    networks: [local]

  mock-issuer:
    build:
      context: .
      dockerfile: local/mock-issuer/Dockerfile
    environment:
      PORT: 55900
      MOCK_ISSUER_URL: ${MOCK_ISSUER_URL:-http://localhost:55900}
      MOCK_ISSUER_TEST_HOOKS: ${MOCK_ISSUER_TEST_HOOKS:-false}
      MOCK_ISSUER_CLIENT_SECRET: ${MOCK_ISSUER_CLIENT_SECRET:-local-dev-client-secret}
      MOCK_ISSUER_SPA_REDIRECT_URIS: ${MOCK_ISSUER_SPA_REDIRECT_URIS:-http://localhost:5173/,http://localhost:5173/callback}
      MOCK_ISSUER_CORS_ORIGINS: ${MOCK_ISSUER_CORS_ORIGINS:-http://localhost:5173}
      MOCK_ISSUER_PRIVATE_KEY_PEM: ${MOCK_ISSUER_PRIVATE_KEY_PEM:-}
      MOCK_ISSUER_CLIENTS: ${MOCK_ISSUER_CLIENTS:-}
    ports:
      - '${MOCK_ISSUER_HOST_PORT:-55900}:55900'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:55900/health']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [local]

volumes:
  postgres-data:

networks:
  local:
